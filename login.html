<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Food Share</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <svg class="leaf" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20c6-2 10-8 16-12" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 2c4 2 6 6 6 10" stroke="#60a860" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>WasteNot</h1>
        </div>
        <nav class="top-nav">
          <a href="/index.html">Home</a>
          <a href="/signup.html">Signup</a>
        </nav>
        <div class="user-info"></div>
      </div>
    </header>

    <main class="container">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required />
        <div id="loginEmailHelp" class="muted" style="font-size:13px;margin-top:4px"></div>
        <label>Password</label>
        <input type="password" id="password" required />
        <button type="submit" id="loginBtn">Login</button>
      </form>
      <p class="muted" style="margin-top:10px">Don't have an account? <a href="/signup.html">Signup</a></p>
      <div id="msg"></div>
    </main>

    <footer class="site-footer">
      <div>Developed by Archit Mittal and team</div>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
